
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-frappe_snippe-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Find tests
        id: check_tests
        run: |
          echo "Finding tests"
          if grep -rn "def test" --exclude-dir=".github" . > /dev/null; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.check_tests.outputs.has_tests == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node
        if: steps.check_tests.outputs.has_tests == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Cache pip
        if: steps.check_tests.outputs.has_tests == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        if: steps.check_tests.outputs.has_tests == 'true'
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        if: steps.check_tests.outputs.has_tests == 'true'
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        if: steps.check_tests.outputs.has_tests == 'true'
        run: sudo apt-get update && sudo apt-get install mariadb-client

      - name: Setup
        if: steps.check_tests.outputs.has_tests == 'true'
        run: |
          pip install frappe-bench
          bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        if: steps.check_tests.outputs.has_tests == 'true'
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app frappe_snippe $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app frappe_snippe
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        if: steps.check_tests.outputs.has_tests == 'true'
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app frappe_snippe
        env:
          TYPE: server
